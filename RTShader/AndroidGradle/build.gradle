// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.8.0' apply false
    id 'com.android.library' version '8.0.2' apply false
}

task clean(type: Delete) {
    // Only this project's literal build child may be removed, even if buildDir is overridden.
    def cleanupDir = new File(rootProject.projectDir.canonicalFile, 'build')
    doFirst {
        if (rootProject.buildDir.canonicalFile != cleanupDir.canonicalFile ||
            cleanupDir.canonicalFile != cleanupDir.absoluteFile ||
            java.nio.file.Files.isSymbolicLink(cleanupDir.toPath())) {
            throw new GradleException('Refusing unsafe clean build directory')
        }
    }
    delete cleanupDir
}